name: Production site monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      notification_probe:
        description: 'Intentional failed run to verify existing notification delivery; no deployment'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: qianhao-production-monitor
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read reviewed monitoring activation
        id: config
        run: |
          python3 deploy/auto_deploy.py monitor-config --source . > monitor-activation.json
          cat monitor-activation.json
          python3 - <<'PY'
          import json
          import os
          with open("monitor-activation.json") as source:
              config = json.load(source)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("enabled=" + str(config["enabled"]).lower() + "\n")
          PY

  verify-production:
    needs: activation
    if: github.event_name == 'workflow_dispatch' || needs.activation.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify live assets and controller heartbeat
        run: python3 deploy/auto_deploy.py monitor
      - name: Intentional notification delivery probe
        if: github.event_name == 'workflow_dispatch' && inputs.notification_probe
        run: |
          printf '%s\n' '::error::Intentional notification delivery probe; no production files changed'
          exit 1
